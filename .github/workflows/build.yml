name: .NET Core Desktop

on:
  push:
    paths-ignore:
      - README.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the publish jobs without creating a release or pushing packages"
        type: boolean
        default: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run Csharpier
        run: |
          dotnet tool restore
          dotnet csharpier check .

  version:
    name: version
    runs-on: ubuntu-22.04
    outputs:
      semver: ${{ steps.gitversion.outputs.SemVer }}
      file_version: ${{ steps.gitversion.outputs.AssemblySemFileVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [lint, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            build: make build appimage -C build/linux VERSION=$FILE_VERSION ARCH=x64
            artifact: build/linux/stalker-gamma+linux.x64.AppImage
            server_artifact: build/linux/stalker-gamma-server+linux.x64.AppImage
          - platform: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            build: make build appimage -C build/linux VERSION=$FILE_VERSION ARCH=arm64
            artifact: build/linux/stalker-gamma+linux.arm64.AppImage
            server_artifact: build/linux/stalker-gamma-server+linux.arm64.AppImage
          
    # each leg only sets its own hash; the empty ones don't overwrite the other legs'
    outputs:
      linux_x64_sha256: ${{ steps.hash.outputs.linux_x64_sha256 }}
      linux_arm64_sha256: ${{ steps.hash.outputs.linux_arm64_sha256 }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # appimagetool validates the AppDirs' AppStream metadata with appstreamcli
      - name: Install appstream
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream

      - name: Build
        env:
          FILE_VERSION: ${{ needs.version.outputs.file_version }}
        run: ${{ matrix.build }}

      - name: Hash
        id: hash
        run: |
          hash=$(sha256sum "${{ matrix.artifact }}" | cut -d ' ' -f 1)
          echo "${{ matrix.platform }}_${{ matrix.arch }}_sha256=$hash" >> $GITHUB_OUTPUT
          server_hash=$(sha256sum "${{ matrix.server_artifact }}" | cut -d ' ' -f 1)
          echo "${{ matrix.platform }}_${{ matrix.arch }}_server_sha256=$server_hash" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.server_artifact }}
          if-no-files-found: error

  # one job creates the draft so parallel build legs can't race into duplicate drafts;
  # publish-release makes it public once every package manager has been updated
  release:
    name: release
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref_type == 'tag' && !inputs.dry_run
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release/*
          fail_on_unmatched_files: true
          token: ${{ secrets.STALKER_GAMMA_CLI_SECRET }}

  print-hashes:
    name: print-hashes
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Print hashes
        env:
          HASHES: ${{ toJSON(needs.build.outputs) }}
        run: echo "$HASHES"

  # release is skipped in a dry run, so don't let that skip cascade into the publish jobs
  publish-release:
    name: publish-release
    runs-on: ubuntu-22.04
    needs: [release]
    if: github.ref_type == 'tag' && !inputs.dry_run
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.STALKER_GAMMA_CLI_SECRET }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
